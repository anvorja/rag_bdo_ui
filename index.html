<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14261d" />
    <meta name="description" content="Asistente virtual que responde con la documentación pública oficial del banco y cita sus fuentes." />
    <title>Asistente RAG</title>
    <script>
      // Aplica el tema antes de pintar para evitar un destello.
      try {
        var t = localStorage.getItem("panel-rag.tema")
        var oscuro = t === "oscuro" || (t !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches)
        if (oscuro) document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
